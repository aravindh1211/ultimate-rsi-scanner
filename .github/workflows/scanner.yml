name: Ultimate RSI Weekly Scanner

on:
  schedule:
    # Every Friday at 14:30 UTC = 8:00 PM IST
    # (NSE closes 3:30 PM IST, US pre-market opens ~7 PM IST — good weekly close window)
    - cron: "30 14 * * 5"

  # Manual trigger from Actions tab — runs immediately regardless of day
  workflow_dispatch:

permissions:
  contents: write   # needed so the workflow can commit the weekly log file back

jobs:
  scan:
    name: Run Ultimate RSI Weekly Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/scanner.py

      - name: Persist weekly log state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/weekly_log.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update weekly log state [skip ci]"
            git push
          fi
